name: Check source and example
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      render_preview:
        type: boolean
        description: Render the music excerpt as an artifact
        default: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: .venv/bin/python -m unittest discover -s tests
      - run: pnpm doctor
      - run: pnpm package
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_preview }}
        run: pnpm preview --out outputs/ci-preview
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_preview }}
        uses: actions/upload-artifact@v4
        with:
          name: music-excerpt
          path: outputs/ci-preview/
